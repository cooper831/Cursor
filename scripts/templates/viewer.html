<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加载中…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --ink: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #2563eb;
      --code-bg: #f4f4f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.75;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(250, 250, 250, 0.88);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.88rem;
    }
    .topbar a { color: var(--accent); text-decoration: none; white-space: nowrap; }
    .topbar a:hover { text-decoration: underline; }
    .topbar .title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 20px 96px; }
    .article :is(h1, h2, h3, h4) { line-height: 1.3; letter-spacing: -0.02em; scroll-margin-top: 72px; }
    .article h1 { font-size: 2rem; margin: 0 0 1rem; }
    .article h2 { font-size: 1.35rem; margin: 2.4rem 0 0.8rem; padding-top: 0.4rem; border-top: 1px solid var(--border); }
    .article h3 { font-size: 1.08rem; margin: 1.6rem 0 0.6rem; }
    .article p, .article li { font-size: 1rem; }
    .article p { margin: 0 0 1rem; }
    .article ul, .article ol { margin: 0 0 1rem; padding-left: 1.35rem; }
    .article li { margin: 0.35rem 0; }
    .article blockquote {
      margin: 1.2rem 0; padding: 0.2rem 0 0.2rem 1rem;
      border-left: 3px solid var(--accent); color: #334155; background: #eff6ff; border-radius: 0 8px 8px 0;
    }
    .article blockquote p:last-child { margin-bottom: 0; }
    .article hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
    .article a { color: var(--accent); }
    .article code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; background: var(--code-bg); padding: 0.12em 0.35em; border-radius: 4px; }
    .article pre { background: #18181b; color: #f4f4f5; padding: 16px 18px; border-radius: 10px; overflow: auto; font-size: 0.88rem; line-height: 1.55; }
    .article pre code { background: none; padding: 0; color: inherit; }
    .article table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin: 1rem 0 1.4rem; }
    .article th, .article td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
    .article th { background: #f4f4f5; }
    .status { color: var(--muted); padding: 48px 20px; text-align: center; }
    .status.error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a href="/_site/">← 文档目录</a>
      <span class="title" id="doc-title">…</span>
    </div>
  </div>
  <main>
    <div id="status" class="status">正在加载文档…</div>
    <article id="article" class="article" hidden></article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var file = params.get("file");
      if (!file && window.location.pathname.indexOf("/read/") === 0) {
        file = decodeURIComponent(window.location.pathname.slice("/read/".length));
      }
      var statusEl = document.getElementById("status");
      var articleEl = document.getElementById("article");
      var titleEl = document.getElementById("doc-title");

      if (!file || file.includes("..") || file.startsWith("/") || file.startsWith("\\")) {
        statusEl.textContent = "缺少或非法的文件参数。";
        statusEl.classList.add("error");
        return;
      }

      titleEl.textContent = file.replace(/\.md$/i, "");
      document.title = titleEl.textContent;

      marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });

      var url = "/" + file.split("/").map(encodeURIComponent).join("/");
      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (md) {
          articleEl.innerHTML = DOMPurify.sanitize(marked.parse(md), { USE_PROFILES: { html: true } });
          statusEl.hidden = true;
          articleEl.hidden = false;
          var h1 = articleEl.querySelector("h1");
          if (h1) document.title = h1.textContent.trim();
        })
        .catch(function (err) {
          statusEl.textContent = "加载失败：" + err.message;
          statusEl.classList.add("error");
        });
    })();
  </script>
</body>
</html>
