<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录/注册/找回密码 - 交互原型</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="m-0 p-0 bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const lucide = window.lucide;

    // ==================== 页面原型组件 ====================

    const LoginPage = ({ onNavigate, onBack }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      return (
        <div className="w-full h-full bg-white flex flex-col">
          <div className="h-12 bg-gradient-to-r from-slate-900 to-slate-800 text-white text-xs flex items-center justify-between px-4">
            <span>9:41</span>
            <div className="flex gap-1">
              <span>📶</span>
              <span>📡</span>
              <span>🔋</span>
            </div>
          </div>

          <div className="h-7 bg-black rounded-b-2xl mx-24 flex justify-center items-center">
            <div className="w-8 h-4 bg-black rounded-full"></div>
          </div>

          <div className="flex-1 overflow-y-auto px-6 pt-8 pb-6">
            <h1 className="text-3xl font-bold text-slate-900 mb-2">登录</h1>
            <p className="text-slate-500 text-sm mb-8">使用邮箱和密码登录账户</p>

            <div className="mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">邮箱地址</label>
              <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">
                <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <input type="email" placeholder="user@example.com" value={email} onChange={(e) => setEmail(e.target.value)} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
              </div>
            </div>

            <div className="mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">密码</label>
              <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">
                <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <input type={showPassword ? 'text' : 'password'} placeholder="至少 8 位" value={password} onChange={(e) => setPassword(e.target.value)} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
                <button onClick={() => setShowPassword(!showPassword)} className="text-slate-400 hover:text-slate-600 transition-colors">
                  {showPassword ? <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-14-14z"/><path fillRule="evenodd" d="M3.5 10c0 4.142 3 7.5 6.5 7.5.707 0 1.393-.078 2.05-.239l-1.4-1.4a4 4 0 01-5.55-5.55l-1.24-1.24C3.73 9.045 3.5 9.5 3.5 10z" clipRule="evenodd"/></svg> : <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fillRule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd"/></svg>}
                </button>
              </div>
            </div>

            <div className="flex justify-end mb-8">
              <button onClick={() => onNavigate('forgot-password')} className="text-blue-600 text-sm font-medium hover:text-blue-700 transition-colors cursor-pointer">忘记密码？</button>
            </div>

            <button onClick={() => onNavigate('home')} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors cursor-pointer mb-4">登录</button>

            <div className="flex items-center gap-3 my-6">
              <div className="flex-1 h-px bg-slate-200"></div>
              <span className="text-slate-400 text-xs">或</span>
              <div className="flex-1 h-px bg-slate-200"></div>
            </div>

            <button onClick={() => onNavigate('register')} className="w-full bg-slate-100 text-slate-900 py-3 rounded-lg font-semibold hover:bg-slate-200 transition-colors cursor-pointer">创建新账户</button>
          </div>
        </div>
      );
    };

    const RegisterPage = ({ onNavigate, onBack }) => {
      const [form, setForm] = useState({ name: '', email: '', password: '', confirmPassword: '' });
      const [agree, setAgree] = useState(false);

      return (
        <div className="w-full h-full bg-white flex flex-col">
          <div className="h-12 bg-gradient-to-r from-slate-900 to-slate-800 text-white text-xs flex items-center justify-between px-4">
            <span>9:41</span>
            <div className="flex gap-1"><span>📶</span><span>📡</span><span>🔋</span></div>
          </div>

          <div className="h-7 bg-black rounded-b-2xl mx-24 flex justify-center items-center">
            <div className="w-8 h-4 bg-black rounded-full"></div>
          </div>

          <div className="px-4 pt-4 pb-2">
            <button onClick={onBack} className="flex items-center gap-2 text-blue-600 hover:text-blue-700 transition-colors cursor-pointer mb-4">
              <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clipRule="evenodd"/></svg>
              <span className="text-sm font-medium">返回</span>
            </button>
          </div>

          <div className="flex-1 overflow-y-auto px-6 pb-6">
            <h1 className="text-3xl font-bold text-slate-900 mb-2">创建账户</h1>
            <p className="text-slate-500 text-sm mb-8">填写下面的信息完成注册</p>

            <div className="mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">姓名</label>
              <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500">
                <svg className="w-5 h-5 text-slate-400 mr-3" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
                <input type="text" placeholder="请输入姓名" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
              </div>
            </div>

            <div className="mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">邮箱地址</label>
              <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500">
                <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <input type="email" placeholder="user@example.com" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
              </div>
            </div>

            <div className="mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">密码</label>
              <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500">
                <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <input type="password" placeholder="至少 8 位，包含大小写和数字" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
              </div>
              <p className="text-xs text-slate-400 mt-2">[AI 补全] 密码强度要求：8+ 位，大小写混合，含数字</p>
            </div>

            <div className="mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">确认密码</label>
              <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500">
                <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <input type="password" placeholder="请再次输入密码" value={form.confirmPassword} onChange={(e) => setForm({ ...form, confirmPassword: e.target.value })} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
              </div>
            </div>

            <div className="flex items-start gap-3 mb-8">
              <input type="checkbox" id="agree" checked={agree} onChange={(e) => setAgree(e.target.checked)} className="mt-1 cursor-pointer" />
              <label htmlFor="agree" className="text-sm text-slate-600">我已阅读并同意<span className="text-blue-600 font-medium cursor-pointer hover:underline">用户协议</span>和<span className="text-blue-600 font-medium cursor-pointer hover:underline">隐私政策</span></label>
            </div>

            <button onClick={() => onNavigate('login')} disabled={!agree} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors cursor-pointer disabled:bg-slate-300 disabled:cursor-not-allowed mb-4">立即注册</button>

            <div className="text-center"><span className="text-slate-600 text-sm">已有账户？</span><button onClick={onBack} className="text-blue-600 text-sm font-medium hover:text-blue-700 cursor-pointer ml-2">立即登录</button></div>
          </div>
        </div>
      );
    };

    const ForgotPasswordPage = ({ onNavigate, onBack }) => {
      const [step, setStep] = useState('email');
      const [email, setEmail] = useState('');
      const [code, setCode] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      const handleSendCode = () => {
        if (email) setStep('verify');
      };

      const handleVerifyCode = () => {
        if (code === '123456') setStep('reset');
      };

      return (
        <div className="w-full h-full bg-white flex flex-col">
          <div className="h-12 bg-gradient-to-r from-slate-900 to-slate-800 text-white text-xs flex items-center justify-between px-4">
            <span>9:41</span>
            <div className="flex gap-1"><span>📶</span><span>📡</span><span>🔋</span></div>
          </div>

          <div className="h-7 bg-black rounded-b-2xl mx-24 flex justify-center items-center">
            <div className="w-8 h-4 bg-black rounded-full"></div>
          </div>

          <div className="px-4 pt-4 pb-2">
            <button onClick={onBack} className="flex items-center gap-2 text-blue-600 hover:text-blue-700 transition-colors cursor-pointer mb-4">
              <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clipRule="evenodd"/></svg>
              <span className="text-sm font-medium">返回登录</span>
            </button>
          </div>

          <div className="flex-1 overflow-y-auto px-6 pb-6">
            <h1 className="text-3xl font-bold text-slate-900 mb-2">找回密码</h1>
            <p className="text-slate-500 text-sm mb-8">
              {step === 'email' && '输入注册邮箱接收验证码'}
              {step === 'verify' && '输入我们发送到邮箱的验证码'}
              {step === 'reset' && '设置新密码'}
            </p>

            {step === 'email' && (
              <>
                <div className="mb-6">
                  <label className="block text-sm font-medium text-slate-700 mb-2">邮箱地址</label>
                  <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500">
                    <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    <input type="email" placeholder="user@example.com" value={email} onChange={(e) => setEmail(e.target.value)} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
                  </div>
                </div>
                <button onClick={handleSendCode} disabled={!email} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors cursor-pointer disabled:bg-slate-300">发送验证码</button>
              </>
            )}

            {step === 'verify' && (
              <>
                <div className="mb-4 p-3 bg-blue-50 rounded-lg border border-blue-200">
                  <p className="text-xs text-blue-700">验证码已发送至 {email}</p>
                </div>
                <div className="mb-6">
                  <label className="block text-sm font-medium text-slate-700 mb-2">验证码</label>
                  <input type="text" placeholder="请输入 6 位数字验证码" maxLength="6" value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, ''))} className="w-full border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-center text-2xl tracking-widest font-mono" />
                  <p className="text-xs text-slate-400 mt-2">[AI 补全] 演示验证码：123456</p>
                </div>
                <button onClick={handleVerifyCode} disabled={code.length !== 6} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors cursor-pointer disabled:bg-slate-300 mb-3">验证</button>
                <button onClick={() => setStep('email')} className="w-full bg-slate-100 text-slate-900 py-3 rounded-lg font-semibold hover:bg-slate-200 transition-colors cursor-pointer">重新输入邮箱</button>
              </>
            )}

            {step === 'reset' && (
              <>
                <div className="mb-6">
                  <label className="block text-sm font-medium text-slate-700 mb-2">新密码</label>
                  <div className="flex items-center border border-slate-300 rounded-lg px-4 py-3 bg-slate-50 focus-within:ring-2 focus-within:ring-blue-500">
                    <svg className="w-5 h-5 text-slate-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <input type={showPassword ? 'text' : 'password'} placeholder="至少 8 位" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} className="flex-1 bg-transparent outline-none text-slate-900 placeholder-slate-400" />
                    <button onClick={() => setShowPassword(!showPassword)} className="text-slate-400 hover:text-slate-600 transition-colors">
                      {showPassword ? <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-14-14z"/></svg> : <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/></svg>}
                    </button>
                  </div>
                </div>
                <button onClick={() => onNavigate('login')} disabled={!newPassword || newPassword.length < 8} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors cursor-pointer disabled:bg-slate-300 mb-3">确认重设</button>
                <button onClick={onBack} className="w-full bg-slate-100 text-slate-900 py-3 rounded-lg font-semibold hover:bg-slate-200 transition-colors cursor-pointer">返回登录</button>
              </>
            )}
          </div>
        </div>
      );
    };

    const HomePage = ({ onNavigate, onBack }) => {
      return (
        <div className="w-full h-full bg-white flex flex-col">
          <div className="h-12 bg-gradient-to-r from-slate-900 to-slate-800 text-white text-xs flex items-center justify-between px-4">
            <span>9:41</span>
            <div className="flex gap-1"><span>📶</span><span>📡</span><span>🔋</span></div>
          </div>
          <div className="h-7 bg-black rounded-b-2xl mx-24 flex justify-center items-center">
            <div className="w-8 h-4 bg-black rounded-full"></div>
          </div>
          <div className="flex-1 overflow-y-auto px-6 py-8 flex flex-col items-center justify-center">
            <div className="text-6xl mb-4">✓</div>
            <h1 className="text-2xl font-bold text-slate-900 text-center">登录成功</h1>
            <p className="text-slate-500 text-center mt-2 mb-8">欢迎回来！</p>
            <button onClick={onBack} className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors cursor-pointer">返回登录</button>
          </div>
        </div>
      );
    };

    // ==================== 页面数据 ====================

    const pageData = [
      { id: 'login', name: '登录页', prototype: LoginPage, status: 'confirmed' },
      { id: 'register', name: '注册页', prototype: RegisterPage, status: 'confirmed' },
      { id: 'forgot-password', name: '找回密码', prototype: ForgotPasswordPage, status: 'confirmed' },
      { id: 'home', name: '首页（成功）', prototype: HomePage, status: 'designing' },
    ];

    // ==================== 主组件 ====================

    function PrototypeReviewPage() {
      const [navStack, setNavStack] = useState(['login']);
      const [leftCollapsed, setLeftCollapsed] = useState(false);
      const [rightCollapsed, setRightCollapsed] = useState(false);
      const [zoom, setZoom] = useState(1);
      const [showDeviceFrame, setShowDeviceFrame] = useState(true);
      const [toasts, setToasts] = useState([]);

      const currentPageId = navStack[navStack.length - 1];
      const currentPage = pageData.find(p => p.id === currentPageId) || pageData[0];
      const Prototype = currentPage.prototype;

      const handleNavigate = (pageId) => {
        const pageExists = pageData.find(p => p.id === pageId);
        if (!pageExists) {
          const id = Math.random().toString();
          setToasts(prev => [...prev, { id, message: `页面 [${pageId}] 尚未定义`, type: 'error' }]);
          setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
          return;
        }
        setNavStack(prev => [...prev, pageId]);
      };

      const handleBack = () => {
        if (navStack.length > 1) {
          setNavStack(prev => prev.slice(0, -1));
        }
      };

      const handleSelectPage = (pageId) => {
        setNavStack([pageId]);
      };

      return (
        <div className="flex h-screen bg-slate-50 overflow-hidden">
          {/* 左栏 */}
          {!leftCollapsed && (
            <div className="w-60 bg-slate-900 border-r border-slate-700 flex flex-col text-slate-100 overflow-hidden">
              <div className="p-4 border-b border-slate-700">
                <button onClick={() => setLeftCollapsed(true)} className="w-full px-3 py-2 bg-slate-800 text-slate-400 rounded hover:bg-slate-700 text-xs font-medium transition-colors">
                  ← 收起
                </button>
              </div>
              <div className="flex-1 overflow-y-auto">
                {pageData.map(page => {
                  const isSelected = currentPageId === page.id;
                  const statusColor = { designing: 'bg-gray-400', reviewing: 'bg-yellow-400', confirmed: 'bg-green-400' }[page.status];
                  return (
                    <button
                      key={page.id}
                      onClick={() => handleSelectPage(page.id)}
                      className={`w-full px-4 py-3 text-left text-sm font-medium transition-colors flex items-center justify-between border-l-4 ${isSelected ? 'border-l-blue-500 bg-slate-800 text-white' : 'border-l-transparent text-slate-400 hover:bg-slate-800'}`}
                    >
                      <span>{page.name}</span>
                      <span className={`w-2 h-2 rounded-full ${statusColor}`} />
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {leftCollapsed && (
            <div className="w-12 bg-slate-800 border-r border-slate-700 flex flex-col items-center py-4 gap-4">
              <button onClick={() => setLeftCollapsed(false)} className="p-2 hover:bg-slate-700 rounded transition-colors">
                <svg className="w-5 h-5 text-slate-400" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clipRule="evenodd"/></svg>
              </button>
              {pageData.map(page => (
                <button key={page.id} onClick={() => handleSelectPage(page.id)} title={page.name} className={`w-8 h-8 rounded flex items-center justify-center transition-colors text-xs font-bold ${currentPageId === page.id ? 'bg-blue-500 text-white' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}>
                  {page.name.charAt(0)}
                </button>
              ))}
            </div>
          )}

          {/* 中栏 */}
          <div className="flex-1 bg-slate-100 flex flex-col">
            <div className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 gap-4">
              <div className="flex items-center gap-2">
                {[0.5, 0.75, 1, 1.25].map(z => (
                  <button key={z} onClick={() => setZoom(z)} className={`px-3 py-1 rounded text-sm font-medium transition-colors ${zoom === z ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                    {Math.round(z * 100)}%
                  </button>
                ))}
              </div>

              <button onClick={() => setShowDeviceFrame(!showDeviceFrame)} className={`px-4 py-2 rounded text-sm font-medium transition-colors flex items-center gap-2 ${showDeviceFrame ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>
                📱 {showDeviceFrame ? 'iPhone' : '无框'}
              </button>

              <div className="flex-1 flex items-center gap-2 text-sm text-slate-600">
                <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
                <span>/</span>
                <span className="font-medium text-slate-900">{currentPage.name}</span>
              </div>
            </div>

            <div className="flex-1 overflow-auto flex items-center justify-center p-6">
              <div style={{ transform: `scale(${zoom})`, transformOrigin: 'top center', transition: 'transform 200ms ease-out' }} className="relative bg-white rounded-2xl shadow-2xl overflow-hidden">
                {showDeviceFrame ? (
                  <div className="relative w-96 h-full" style={{ height: '812px' }}>
                    <div className="absolute inset-0 border-8 border-black rounded-3xl pointer-events-none bg-black" />
                    <div className="absolute inset-8 bg-white rounded-3xl overflow-hidden">
                      <Prototype onNavigate={handleNavigate} onBack={handleBack} />
                    </div>
                  </div>
                ) : (
                  <div className="w-96" style={{ height: '812px' }}>
                    <Prototype onNavigate={handleNavigate} onBack={handleBack} />
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* 右栏 */}
          {!rightCollapsed && (
            <div className="w-96 bg-white border-l border-slate-200 flex flex-col">
              <div className="h-12 bg-slate-50 border-b border-slate-200 flex items-center px-4 gap-2">
                <button onClick={() => setRightCollapsed(true)} className="ml-auto p-1 hover:bg-slate-200 rounded transition-colors">
                  <svg className="w-5 h-5 text-slate-600" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clipRule="evenodd"/></svg>
                </button>
              </div>
              <div className="flex-1 overflow-y-auto p-4 prose prose-sm max-w-none text-slate-700 text-sm">
                <h2 className="text-lg font-bold mb-4">{currentPage.name}</h2>
                <p>✅ 页面已加载</p>
                <ul>
                  <li>点击左栏选择不同页面</li>
                  <li>中栏点击按钮进行交互</li>
                  <li>使用缩放控制查看不同尺寸</li>
                  <li>启用/禁用 iPhone 外壳效果</li>
                </ul>
              </div>
            </div>
          )}

          {rightCollapsed && (
            <button onClick={() => setRightCollapsed(false)} className="w-12 bg-slate-100 border-l border-slate-200 flex items-center justify-center hover:bg-slate-200 transition-colors">
              <svg className="w-5 h-5 text-slate-600" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 11H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clipRule="evenodd"/></svg>
            </button>
          )}

          {/* Toast */}
          <div className="fixed bottom-4 right-4 z-50 space-y-2">
            {toasts.map(toast => (
              <div key={toast.id} className="px-4 py-3 rounded-lg shadow-lg text-sm font-medium bg-red-500 text-white animate-slide-up">
                {toast.message}
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PrototypeReviewPage />);
  </script>

  <style>
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slide-up 0.3s ease-out; }
  </style>
</body>
</html>
