                { name: "99% Water Baby Wipes", line: "Thick texture, sensitive skin.", price: "$34.99", collection: "#p-wipes" },
                { name: "Hooded Bath Towel Set", line: "Plush hood, quick dry.", price: "$41.00", collection: "#p-towel" },

              ],

      };

      function param(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function escapeHtml(t) {
        var d = document.createElement("div");
        d.textContent = t;
        return d.innerHTML;
      }

      function cardHtml(p) {
        return (
          '<div class="wf-ess" data-name="' +
          escapeHtml(p.name) +
          '" data-price="' +
          escapeHtml(p.price) +
          '">' +
          '<div class="wf-ess-visual" aria-hidden="true">Image</div>' +
          '<div class="wf-ess-body">' +
          '<div class="wf-ess-name">' +
          escapeHtml(p.name) +
          "</div>" +
          '<p class="wf-ess-line">' +
          escapeHtml(p.line) +
          "</p>" +
          '<div class="wf-ess-price">' +
          escapeHtml(p.price) +
          "</div>" +
          '<button type="button" class="wf-ess-buy"><span class="wf-ess-buy-label">Learn more</span><span class="wf-ess-buy-arr" aria-hidden="true"> →</span></button>' +
          "</div></div>"
        );
      }

      function groupHtml(g) {
        var cards = g.items.map(cardHtml).join("");
        return (
          '<div class="wf-product-group">' +
          '<h3 class="wf-group-title">' +
          escapeHtml(g.title) +
          "</h3>" +
          '<div class="wf-grid2">' +
          cards +
          "</div></div>"
        );
      }

      function bindBuyDelegation(mount) {
        mount.addEventListener("click", function (e) {
          var t = e.target && e.target.closest ? e.target.closest(".wf-ess-buy") : null;
          if (t) {
            var card = t.closest(".wf-ess");
            var n = card ? card.getAttribute("data-name") : "";
            var pr = card ? card.getAttribute("data-price") : "";
            alert("Learn more → PDP (demo)\n" + (n || "Product") + "\n" + (pr || ""));
          }
        });
      }

      function setupLoadMore(sectionEl, s) {
        var mount = sectionEl.querySelector("#groups-mount");
        var btn = sectionEl.querySelector("#wf-load-more");
        var end = sectionEl.querySelector("#wf-load-end");
        var groups = s.productGroups || [];
        var nextIndex = 0;

        function finish() {
          btn.hidden = true;
          end.hidden = false;
        }

        if (!groups.length) {
          finish();
          return;
        }

        function appendNext() {
          if (nextIndex >= groups.length) return;
          mount.insertAdjacentHTML("beforeend", groupHtml(groups[nextIndex]));
          nextIndex++;
          if (nextIndex >= groups.length) finish();
        }

        bindBuyDelegation(mount);

        appendNext();
        if (groups.length <= 1) finish();
        else {
          btn.hidden = false;
          end.hidden = true;
        }

        btn.addEventListener("click", function () {
          appendNext();
          if (nextIndex >= groups.length) finish();
        });
      }

      function render() {
        var id = param("scene") || "feeding";
        var s = SCENES[id];
        var root = document.getElementById("detail-root");
        if (!s) {
          root.innerHTML =
            '<div class="wf-invalid"><p>Unknown scene. Use <code>?scene=pregnancy|feeding|recovery|outing|parenting</code></p></div>';
          return;
        }

        document.documentElement.style.setProperty("--accent", s.accent);
        document.documentElement.style.setProperty("--accent-soft", s.accentSoft);

        var kw = s.keywords
          .map(function (k) {
            return "<li>" + escapeHtml(k) + "</li>";
          })
          .join("");

        var heroPhotoMap = {
          feeding: { src: "assets/hero-cozy-feeding-feed-scene.png", cls: "" },
          pregnancy: { src: "assets/hero-cozy-pregnancy-scene.png", cls: " wf-hero-ph--scene-pregnancy" },
          recovery: { src: "assets/hero-cozy-recovery-scene.png", cls: " wf-hero-ph--scene-recovery" },
          outing: { src: "assets/hero-cozy-outing-scene.png", cls: " wf-hero-ph--scene-outing" },
          parenting: { src: "assets/hero-cozy-parenting-scene.png", cls: " wf-hero-ph--scene-parenting" },
        };
        var hp = heroPhotoMap[id];
        var heroBlock = hp
          ? '<div class="wf-hero-ph wf-hero-ph--photo' +
            hp.cls +
            '"><img src="' +
            hp.src +
            '" alt="" decoding="async" /></div>'
          : '<div class="wf-hero-ph">Hero · immersive scene image (placeholder)</div>';

        root.innerHTML =
          '<section class="wf-hero">' +
          heroBlock +
          '<div class="wf-hero-cap" style="--accent:' +
          s.accent +
          '">' +
          "<h1>" +
          escapeHtml(s.name) +
          "</h1>" +
          '<ul class="wf-keywords">' +
          kw +
          "</ul></div></section>" +
          '<section class="wf-block">' +
          "<h2>Brand manifesto</h2>" +
          '<p class="wf-manifesto">' +
          escapeHtml(s.manifesto) +
          "</p></section>" +
          '<section class="wf-block wf-block--essentials" id="ess-section" aria-label="Product edit">' +
          '<div class="wf-glass-wrap">' +
          '<div id="groups-mount"></div>' +
          '<div class="wf-load-wrap">' +
          '<button type="button" id="wf-load-more" class="wf-load-more">Load more</button>' +
          '<p id="wf-load-end" class="wf-load-end" hidden>end</p>' +
          "</div></div></section>" +
          '<div class="wf-cta-global">' +
          '<button type="button" id="global-cta" class="wf-global-cta-btn">' +
          escapeHtml("Go to the store — " + s.name + " full range >>") +
          "</button></div>";

        setupLoadMore(document.getElementById("ess-section"), s);

        document.getElementById("global-cta").addEventListener("click", function () {
          alert(
            "Placeholder: open DTC\nhttps://momcozy.com/collections/" +
              s.storePath +
              "\n\nDesigner: add handoff transition before external browser / in-app webview."
          );
        });
      }

      render();
    </script>
  </body>
</html>
